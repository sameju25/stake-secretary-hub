<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stake Secretary Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Order matters: app.js defines the App helpers, storage.js the data layer, then each module registers itself. -->
  <script defer src="js/app.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/dashboard.js"></script>
  <script defer src="js/calendar.js"></script>
  <script defer src="js/interviews.js"></script>
  <script defer src="js/meetings.js"></script>
  <script defer src="js/tasks.js"></script>
  <script defer src="js/followups.js"></script>
  <script defer src="js/contacts.js"></script>
  <script defer src="js/templates.js"></script>
  <script defer src="js/minutes.js"></script>
  <script defer src="js/polls.js"></script>
  <script defer src="js/callings.js"></script>
  <script defer src="js/search.js"></script>
  <script defer src="js/settings.js"></script>
</head>
<body>
  <aside class="sidebar">
    <h1>Stake Secretary Hub</h1>
    <input id="globalSearch" type="search" placeholder="Search everything" aria-label="Search everything">
    <nav id="nav" aria-label="Main"></nav>
    <p class="privacy">Personal tool. Scheduling details only, nothing confidential.</p>
  </aside>
  <main id="view" tabindex="-1"></main>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
